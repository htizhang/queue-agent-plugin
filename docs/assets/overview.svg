<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="984" viewBox="0 0 1200 984" role="img" aria-labelledby="ov-title ov-desc">
  <title id="ov-title">Queue Agent Plugin: entry routes</title>
  <desc id="ov-desc">Your request, with the artifacts you already have, goes to the queue-agent entry skill. The entry skill chooses a starting point from the request; the Stages are capabilities, not a mandatory sequence. Data and a system description, or a model to check against data, route to Stage 1, queue modeling, which returns a documented model and its simulator. A model, simulator, or model family routes directly to Stage 2, policy design. A simulator is optional at entry. Stage 2 returns a policy or recommendation with evidence. Stage 1 can hand off to Stage 2 as an optional step. During research, the Discovery Lab, attached to Stage 2, opens only on explicit requests to design a new algorithm. A separate contribution request may also read relevant Lab material. A literature question routes to the shared queue-literature skill. Text to write or clarify routes to the shared asd-ste100 writing skill. A request to contribute routes to the opt-in queue-contribute skill, which publishes a checked change only as far as you authorize.</desc>
  <defs>
    <style>
      .d { font-family: "DIN Alternate", Bahnschrift, "Roboto Condensed", "Helvetica Neue", Arial, "Liberation Sans", sans-serif; font-weight: 700; fill: #17232A; }
      .s { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; fill: #17232A; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", "Liberation Mono", "DejaVu Sans Mono", monospace; fill: #4B5A55; }
      .eb { font-size: 15px; letter-spacing: 1.8px; fill: #2343A0; }
      .gr { fill: #4B5A55; }
      .ln { fill: none; stroke: #17232A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 9 7; stroke-linecap: butt; }
      .dot { stroke-dasharray: 0.1 7; stroke-linecap: round; stroke-width: 3; }
      .card { fill: #F9FBF7; stroke: #17232A; stroke-width: 1.5; }
      .card-dot { fill: #F9FBF7; stroke: #4B5A55; stroke-width: 2.6; stroke-dasharray: 0.1 6.5; stroke-linecap: round; }
      .glyph { fill: none; stroke: #17232A; stroke-width: 2.2; }
      .slot { stroke: #17232A; stroke-width: 1.6; }
      .server { fill: #F9FBF7; stroke: #17232A; stroke-width: 2.2; }
    </style>
    <pattern id="ov-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#DCE5D8" stroke-width="1"/>
    </pattern>
    <marker id="ov-ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1.2 L11.5 6 L1 10.8 Z" fill="#17232A"/>
    </marker>
    <marker id="ov-ah-g" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1.2 L11.5 6 L1 10.8 Z" fill="#4B5A55"/>
    </marker>
    <g id="ov-station">
      <path class="glyph" d="M0 -17H36V17H0"/>
      <path class="slot" d="M12 -17V17M24 -17V17"/>
      <circle class="server" cx="55" cy="0" r="17"/>
    </g>
  </defs>

  <rect width="1200" height="984" rx="18" fill="#EFF3EC"/>
  <rect width="1200" height="984" rx="18" fill="url(#ov-grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="982.5" rx="17.5" fill="none" stroke="#C5D2C1" stroke-width="1.5"/>

  <!-- Header -->
  <text class="d eb" x="56" y="60">QUEUE AGENT PLUGIN · ENTRY ROUTES</text>
  <text class="d" x="56" y="102" font-size="36">Start where your work already is</text>
  <text class="s gr" x="56" y="136" font-size="20">The Stages are capabilities, not a mandatory sequence.</text>

  <!-- Source and dispatcher -->
  <rect class="card" x="56" y="166" width="364" height="66" rx="8" stroke-width="2"/>
  <text class="d" x="78" y="195" font-size="23">Your request</text>
  <text class="s gr" x="78" y="220" font-size="17">and the artifacts you already have</text>
  <line class="ln" x1="110" y1="232" x2="110" y2="262" marker-end="url(#ov-ah)"/>
  <circle cx="110" cy="300" r="36" fill="#F9FBF7" stroke="#17232A" stroke-width="2.5"/>
  <path class="ln" d="M110 276V295M110 295L93 320M110 295V325M110 295L127 320" stroke-width="2.4"/>
  <circle cx="110" cy="295" r="3.4" fill="#17232A"/>
  <text class="m" x="164" y="295" font-size="20" style="fill:#17232A">queue-agent</text>
  <text class="s gr" x="164" y="321" font-size="17">entry skill: chooses the starting point</text>

  <!-- Trunk -->
  <line class="ln" x1="110" y1="336" x2="110" y2="866"/>

  <!-- Route 1: Stage 1 -->
  <line class="ln" x1="110" y1="396" x2="451" y2="396" marker-end="url(#ov-ah)"/>
  <text class="s" x="136" y="384" font-size="19">Data and a system description</text>
  <text class="s gr" x="136" y="420" font-size="16.5">or a model to check against data</text>
  <use href="#ov-station" x="454" y="396"/>
  <rect class="card" x="544" y="358" width="356" height="76" rx="8" stroke-width="2.2"/>
  <text class="d eb" x="566" y="386">STAGE 1</text>
  <text class="m" x="880" y="386" font-size="17" text-anchor="end">queue-modeling</text>
  <text class="d" x="566" y="419" font-size="26">Queue modeling</text>
  <line class="ln" x1="900" y1="396" x2="933" y2="396" marker-end="url(#ov-ah)"/>
  <text class="s" x="946" y="390" font-size="18">Documented model</text>
  <text class="s" x="946" y="413" font-size="18">+ its simulator</text>

  <!-- Optional handoff Stage 1 -> Stage 2 -->
  <line class="ln dash" x1="620" y1="434" x2="620" y2="472" marker-end="url(#ov-ah)"/>
  <text class="s gr" x="636" y="459" font-size="16">optional handoff</text>

  <!-- Route 2: Stage 2 -->
  <line class="ln" x1="110" y1="512" x2="451" y2="512" marker-end="url(#ov-ah)"/>
  <text class="s" x="136" y="500" font-size="19">A model, simulator, or family</text>
  <text class="s gr" x="136" y="536" font-size="16.5">a simulator is optional at entry</text>
  <use href="#ov-station" x="454" y="512"/>
  <rect class="card" x="544" y="474" width="356" height="76" rx="8" stroke-width="2.2"/>
  <text class="d eb" x="566" y="502">STAGE 2</text>
  <text class="m" x="880" y="502" font-size="17" text-anchor="end">queue-policy</text>
  <text class="d" x="566" y="535" font-size="26">Policy design</text>
  <line class="ln" x1="900" y1="512" x2="933" y2="512" marker-end="url(#ov-ah)"/>
  <text class="s" x="946" y="495" font-size="17.5">Policy or</text>
  <text class="s" x="946" y="516" font-size="17.5">recommendation</text>
  <text class="s" x="946" y="537" font-size="17.5">+ evidence</text>

  <!-- Discovery Lab: explicit request only -->
  <line class="ln dot" x1="620" y1="553" x2="620" y2="570" stroke="#4B5A55" style="stroke:#4B5A55"/>
  <rect class="card-dot" x="600" y="574" width="300" height="84" rx="8"/>
  <text class="d" x="620" y="601" font-size="18">Discovery Lab · research use</text>
  <text class="s gr" x="620" y="624" font-size="16">only for explicit requests to</text>
  <text class="s gr" x="620" y="645" font-size="16">design a new algorithm</text>

  <!-- Route 3: Literature -->
  <line class="ln" x1="110" y1="706" x2="451" y2="706" marker-end="url(#ov-ah)"/>
  <text class="s" x="136" y="694" font-size="19">A literature question</text>
  <text class="s gr" x="136" y="730" font-size="16.5">or a question about prior work</text>
  <use href="#ov-station" x="454" y="706"/>
  <rect class="card" x="544" y="670" width="356" height="72" rx="8"/>
  <text class="d eb" x="566" y="697">SHARED</text>
  <text class="m" x="880" y="697" font-size="17" text-anchor="end">queue-literature</text>
  <text class="d" x="566" y="728" font-size="25">Literature</text>
  <line class="ln" x1="900" y1="706" x2="933" y2="706" marker-end="url(#ov-ah)"/>
  <text class="s" x="946" y="700" font-size="18">Source-grounded</text>
  <text class="s" x="946" y="723" font-size="18">answer</text>

  <!-- Route 4: Writing -->
  <line class="ln" x1="110" y1="786" x2="451" y2="786" marker-end="url(#ov-ah)"/>
  <text class="s" x="136" y="774" font-size="19">Text to write or clarify</text>
  <text class="s gr" x="136" y="810" font-size="16.5">model descriptions or reports</text>
  <use href="#ov-station" x="454" y="786"/>
  <rect class="card" x="544" y="750" width="356" height="72" rx="8"/>
  <text class="d eb" x="566" y="777">SHARED</text>
  <text class="m" x="880" y="777" font-size="17" text-anchor="end">asd-ste100</text>
  <text class="d" x="566" y="808" font-size="25">Writing</text>
  <line class="ln" x1="900" y1="786" x2="933" y2="786" marker-end="url(#ov-ah)"/>
  <text class="s" x="946" y="780" font-size="18">Text for readers</text>
  <text class="s" x="946" y="803" font-size="18">outside the work</text>

  <!-- Route 5: Contribution (explicit request only) -->
  <line class="ln dot" x1="110" y1="866" x2="449" y2="866"/>
  <path d="M441 860.6 L452 866 L441 871.4 Z" fill="#17232A"/>
  <text class="s" x="136" y="854" font-size="19">A request to contribute</text>
  <text class="s gr" x="136" y="890" font-size="16.5">opt-in, never automatic</text>
  <use href="#ov-station" x="454" y="866"/>
  <rect class="card-dot" x="544" y="830" width="356" height="72" rx="8"/>
  <text class="d eb" x="566" y="857">OPT-IN</text>
  <text class="m" x="880" y="857" font-size="17" text-anchor="end">queue-contribute</text>
  <text class="d" x="566" y="888" font-size="25">Contribution</text>
  <line class="ln" x1="900" y1="866" x2="933" y2="866" marker-end="url(#ov-ah)"/>
  <text class="s" x="946" y="860" font-size="18">A checked change,</text>
  <text class="s" x="946" y="883" font-size="18">only as authorized</text>

  <!-- Legend -->
  <line x1="56" y1="922" x2="1144" y2="922" stroke="#C5D2C1" stroke-width="1.5"/>
  <line class="ln" x1="56" y1="950" x2="100" y2="950" marker-end="url(#ov-ah)"/>
  <text class="s gr" x="114" y="956" font-size="16.5">route or main flow</text>
  <line class="ln dash" x1="318" y1="950" x2="362" y2="950" marker-end="url(#ov-ah)"/>
  <text class="s gr" x="376" y="956" font-size="16.5">optional step</text>
  <line class="ln dot" x1="548" y1="950" x2="594" y2="950"/>
  <text class="s gr" x="608" y="956" font-size="16.5">explicit request only</text>
  <use href="#ov-station" x="830" y="950" transform="translate(830 950) scale(0.72) translate(-830 -950)"/>
  <text class="s gr" x="890" y="956" font-size="16.5">a skill: buffer and server</text>
</svg>
