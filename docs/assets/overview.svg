<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="512" viewBox="0 0 1084 512" role="img" aria-labelledby="ov-title ov-desc">
  <title id="ov-title">Queue Agent Plugin research workflow: from data to a queue model to a policy</title>
  <desc id="ov-desc">The figure reads from left to right: data, a queue model, and a policy. Stage 1, queue modeling, starts from event records and a system description. It formulates and calibrates the model, builds the simulator, and validates both independently, revising them as needed. Stage 1 delivers two matching results: a documented queue model and the simulator that implements it. An optional handoff passes them to Stage 2. Stage 2 can also start from your own model or model family, and it builds a simulator if one is needed. Stage 2, policy design, first confirms the problem with you. It then adopts, compares, tunes, or designs a policy, evaluates it, and explains the result. New designs also go through mechanism analysis, simplification, and reevaluation. Stage 2 delivers a policy with its explanation and evidence. Either Stage can be used on its own. Both Stages use queueing literature, and a reader outside the work checks their written explanations.</desc>
  <defs>
    <style>
      text { font-family: Helvetica, Arial, "Liberation Sans", "Nimbus Sans", sans-serif; fill: #3B4752; }
      .tag { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
      .h1 { font-size: 20px; font-weight: 700; fill: #1D2731; }
      .h2 { font-size: 16px; font-weight: 700; fill: #1D2731; }
      .b { font-size: 16px; }
      .s { font-size: 15px; fill: #5A6672; }
      .blue { fill: #2B5480; }
      .amber { fill: #9A5512; }
      .slate { fill: #5A6672; }
      .card { fill: #F3F5F7; stroke: #A7B1BA; stroke-width: 1.2; }
      .sub { fill: #FFFFFF; stroke: #A7B1BA; stroke-width: 1.2; }
      .stage { fill: #EEF3F9; stroke: #34618F; stroke-width: 1.8; }
      .rule { stroke: #C3D2E2; stroke-width: 1.2; }
      .ar { fill: none; stroke: #1D2731; stroke-width: 2; }
      .ar-step { fill: none; stroke: #34618F; stroke-width: 1.6; }
      .ar-loop { fill: none; stroke: #B0661C; stroke-width: 2.2; stroke-linejoin: round; }
      .ar-opt { fill: none; stroke: #5A6672; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
    <marker id="ov-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#1D2731"/>
    </marker>
    <marker id="ov-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#34618F"/>
    </marker>
    <marker id="ov-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#B0661C"/>
    </marker>
    <marker id="ov-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#5A6672"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1083" height="511" rx="14" fill="#FFFFFF" stroke="#D5DBE1"/>
  <text class="tag slate" x="24" y="40">QUEUE AGENT PLUGIN · RESEARCH WORKFLOW</text>

  <!-- Data -->
  <rect class="card" x="24" y="160" width="144" height="120" rx="10"/>
  <text class="h1" x="40" y="190">Data</text>
  <text class="b" x="40" y="216">event records</text>
  <text class="b" x="40" y="236">and a system</text>
  <text class="b" x="40" y="256">description</text>
  <line class="ar" x1="168" y1="220" x2="194" y2="220" marker-end="url(#ov-ink)"/>

  <!-- Stage 1 -->
  <rect class="stage" x="196" y="72" width="216" height="292" rx="12"/>
  <text class="tag blue" x="214" y="102">STAGE 1</text>
  <text class="h1" x="214" y="130">Queue modeling</text>
  <line class="rule" x1="214" y1="146" x2="394" y2="146"/>
  <text class="b" x="214" y="176">Formulate and</text>
  <text class="b" x="214" y="196">calibrate the model</text>
  <line class="ar-step" x1="222" y1="206" x2="222" y2="226" marker-end="url(#ov-blue)"/>
  <text class="b" x="214" y="248">Build the simulator</text>
  <line class="ar-step" x1="222" y1="258" x2="222" y2="278" marker-end="url(#ov-blue)"/>
  <text class="b" x="214" y="300">Validate</text>
  <text class="b" x="214" y="320">independently</text>
  <path class="ar-loop" d="M378 306 H396 V170 H382" marker-end="url(#ov-amber)"/>
  <text class="s amber" x="388" y="273" text-anchor="end">revise</text>
  <line class="ar" x1="412" y1="220" x2="438" y2="220" marker-end="url(#ov-ink)"/>

  <!-- Queue model -->
  <rect class="card" x="440" y="124" width="172" height="192" rx="10"/>
  <text class="h1" x="456" y="154">Queue model</text>
  <rect class="sub" x="452" y="168" width="148" height="62" rx="7"/>
  <text class="h2" x="466" y="194">Documented</text>
  <text class="h2" x="466" y="214">model</text>
  <rect class="sub" x="452" y="242" width="148" height="62" rx="7"/>
  <text class="h2" x="466" y="268">Matching</text>
  <text class="h2" x="466" y="288">simulator</text>
  <line class="ar-opt" x1="612" y1="220" x2="680" y2="220" marker-end="url(#ov-slate)"/>
  <text class="s" x="647" y="208" text-anchor="middle">optional</text>

  <!-- Second entry -->
  <text class="tag slate" x="440" y="352">OR START WITH</text>
  <rect class="card" x="440" y="362" width="172" height="74" rx="10"/>
  <text class="h2" x="456" y="391">Your own model</text>
  <text class="b" x="456" y="414">or model family</text>
  <path class="ar" d="M612 399 H726 V366" marker-end="url(#ov-ink)"/>
  <text class="s" x="742" y="396">Stage 2 builds a</text>
  <text class="s" x="742" y="416">simulator if needed</text>

  <!-- Stage 2 -->
  <rect class="stage" x="682" y="72" width="216" height="292" rx="12"/>
  <text class="tag blue" x="700" y="102">STAGE 2</text>
  <text class="h1" x="700" y="130">Policy design</text>
  <line class="rule" x1="700" y1="146" x2="880" y2="146"/>
  <text class="b" x="700" y="176">Confirm the problem</text>
  <text class="b" x="700" y="196">with you</text>
  <line class="ar-step" x1="708" y1="206" x2="708" y2="226" marker-end="url(#ov-blue)"/>
  <text class="b" x="700" y="248">Adopt, compare,</text>
  <text class="b" x="700" y="268">tune, or design</text>
  <line class="ar-step" x1="708" y1="278" x2="708" y2="298" marker-end="url(#ov-blue)"/>
  <text class="b" x="700" y="320">Evaluate and explain</text>
  <text class="b" x="700" y="340">Refine new designs</text>
  <path class="ar-loop" d="M864 326 H882 V254 H868" marker-end="url(#ov-amber)"/>
  <text class="s amber" x="874" y="293" text-anchor="end">iterate</text>
  <line class="ar" x1="898" y1="220" x2="924" y2="220" marker-end="url(#ov-ink)"/>

  <!-- Policy -->
  <rect class="card" x="926" y="160" width="134" height="120" rx="10"/>
  <text class="h1" x="942" y="190">Policy</text>
  <text class="b" x="942" y="216">with its</text>
  <text class="b" x="942" y="236">explanation</text>
  <text class="b" x="942" y="256">and evidence</text>

  <!-- Shared support -->
  <rect x="196" y="452" width="702" height="40" rx="8" fill="#F3F5F7"/>
  <text class="tag slate" x="214" y="477">BOTH STAGES</text>
  <text class="s" x="352" y="477">queueing literature · document-only reader checks</text>
</svg>
