<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1064" viewBox="0 0 1200 1064" role="img" aria-labelledby="s1-title s1-desc">
  <title id="s1-title">Stage 1, queue modeling: a documented model and its matching simulator</title>
  <desc id="s1-desc">You bring observations, such as event records, and a system description, and optionally an existing model or simulator to check against the data. The main agent models the system: jobs, resources, routing, the system boundary, decision timing, and information. It implements a simulator that keeps system rules, fitted estimates, the replaceable policy, and measurements separate, with explicit seeds and an early small run. The model description, the simulator, and the original evidence go to an independent validator, a separate subagent when the host supports one. The validator writes and runs its own checks: model and implementation agreement, mechanics, data agreement, and policy use. It returns findings with evidence to reproduce them. The main agent integrates this feedback against the evidence. Feedback can revise the model, the implementation, or both, and the affected checks are rerun. When checks support the intended use, you get back two consistent deliverables: a documented, self-contained queue model and the corresponding simulator, plus concise validation results and remaining issues. A handoff to Stage 2 is optional and happens only when you request policy work.</desc>
  <defs>
    <style>
      .d { font-family: "DIN Alternate", Bahnschrift, "Roboto Condensed", "Helvetica Neue", Arial, "Liberation Sans", sans-serif; font-weight: 700; fill: #17232A; }
      .s { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif; fill: #17232A; }
      .m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", "Liberation Mono", "DejaVu Sans Mono", monospace; fill: #4B5A55; }
      .eb { font-size: 15px; letter-spacing: 1.8px; fill: #2343A0; }
      .lab { font-size: 15px; letter-spacing: 1.8px; fill: #4B5A55; }
      .gr { fill: #4B5A55; }
      .rd { fill: #B23A2E; }
      .ln { fill: none; stroke: #17232A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .lr { fill: none; stroke: #B23A2E; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 9 7; stroke-linecap: butt; }
      .card { fill: #F9FBF7; stroke: #17232A; stroke-width: 1.5; }
      .card-dash { fill: #F9FBF7; stroke: #17232A; stroke-width: 1.8; stroke-dasharray: 9 7; }
      .val { fill: #E5EBF6; stroke: #2343A0; stroke-width: 2.2; }
      .chip { fill: #F9FBF7; stroke: #2343A0; stroke-width: 1.3; }
    </style>
    <pattern id="s1-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#DCE5D8" stroke-width="1"/>
    </pattern>
    <marker id="s1-ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1.2 L11.5 6 L1 10.8 Z" fill="#17232A"/>
    </marker>
    <marker id="s1-ah-r" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1.2 L11.5 6 L1 10.8 Z" fill="#B23A2E"/>
    </marker>
  </defs>

  <rect width="1200" height="1064" rx="18" fill="#EFF3EC"/>
  <rect width="1200" height="1064" rx="18" fill="url(#s1-grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="1062.5" rx="17.5" fill="none" stroke="#C5D2C1" stroke-width="1.5"/>

  <!-- Header -->
  <text class="d eb" x="56" y="60">STAGE 1 · QUEUE MODELING</text>
  <text class="d" x="56" y="102" font-size="34">A documented model and its matching simulator</text>
  <text class="m" x="56" y="134" font-size="17">skills/queue-modeling/SKILL.md</text>

  <!-- Legend -->
  <line class="ln" x1="734" y1="56" x2="770" y2="56" marker-end="url(#s1-ah)"/>
  <text class="s gr" x="782" y="61" font-size="15.5">main flow</text>
  <line class="ln dash" x1="880" y1="56" x2="916" y2="56" marker-end="url(#s1-ah)"/>
  <text class="s gr" x="928" y="61" font-size="15.5">optional</text>
  <line class="lr" x1="1014" y1="56" x2="1050" y2="56" marker-end="url(#s1-ah-r)"/>
  <text class="s gr" x="1062" y="61" font-size="15.5">feedback</text>

  <!-- You bring -->
  <text class="d lab" x="56" y="186">YOU BRING</text>
  <rect class="card" x="72" y="198" width="320" height="66" rx="8"/>
  <text class="d" x="94" y="226" font-size="21">Observations</text>
  <text class="s gr" x="94" y="250" font-size="16.5">event records or other data</text>
  <rect class="card" x="412" y="198" width="320" height="66" rx="8"/>
  <text class="d" x="434" y="226" font-size="21">System description</text>
  <text class="s gr" x="434" y="250" font-size="16.5">resources, routing, and rules</text>
  <rect class="card-dash" x="752" y="198" width="376" height="66" rx="8"/>
  <text class="d" x="774" y="226" font-size="20">Existing model or simulator</text>
  <text class="s gr" x="774" y="250" font-size="16.5">optional, to check against data</text>

  <line class="ln" x1="232" y1="264" x2="232" y2="330" marker-end="url(#s1-ah)"/>
  <path class="ln" d="M572 264V298H400V330" marker-end="url(#s1-ah)"/>
  <line class="ln dash" x1="940" y1="264" x2="940" y2="330" marker-end="url(#s1-ah)"/>

  <!-- A: model the system -->
  <rect class="card" x="72" y="332" width="424" height="116" rx="8" stroke-width="2"/>
  <text class="d" x="96" y="368" font-size="23">Model the system</text>
  <text class="s gr" x="96" y="394" font-size="16.5">jobs, resources, routing, boundary</text>
  <text class="s gr" x="96" y="416" font-size="16.5">decision timing and information</text>
  <text class="s gr" x="96" y="438" font-size="16.5">observed data vs. latent mechanisms</text>

  <!-- B: implement the simulator -->
  <rect class="card" x="704" y="332" width="424" height="116" rx="8" stroke-width="2"/>
  <text class="d" x="728" y="368" font-size="23">Implement the simulator</text>
  <text class="s gr" x="728" y="394" font-size="16.5">system rules, fitted estimates,</text>
  <text class="s gr" x="728" y="416" font-size="16.5">replaceable policy, measurements</text>
  <text class="s gr" x="728" y="438" font-size="16.5">explicit seeds, a small case first</text>

  <line class="ln" x1="496" y1="390" x2="702" y2="390" marker-end="url(#s1-ah)"/>

  <!-- B -> C -->
  <line class="ln" x1="1000" y1="448" x2="1000" y2="538" marker-end="url(#s1-ah)"/>
  <text class="s gr" x="988" y="486" font-size="16" text-anchor="end">model, simulator, and</text>
  <text class="s gr" x="988" y="508" font-size="16" text-anchor="end">the original evidence</text>

  <!-- C: independent validation -->
  <rect class="val" x="704" y="540" width="424" height="196" rx="10"/>
  <text class="d" x="728" y="568" font-size="14" letter-spacing="1.4" style="fill:#2343A0">SEPARATE SUBAGENT, WHEN AVAILABLE</text>
  <text class="d" x="728" y="598" font-size="23">Independent validation</text>
  <text class="s" x="728" y="623" font-size="16.5">writes and runs its own checks</text>
  <text class="s" x="728" y="645" font-size="16.5">from the original evidence</text>
  <rect class="chip" x="728" y="662" width="232" height="28" rx="14"/>
  <text class="s" x="844" y="681" font-size="15" text-anchor="middle">Model ↔ implementation</text>
  <rect class="chip" x="970" y="662" width="112" height="28" rx="14"/>
  <text class="s" x="1026" y="681" font-size="15" text-anchor="middle">Mechanics</text>
  <rect class="chip" x="728" y="700" width="156" height="28" rx="14"/>
  <text class="s" x="806" y="719" font-size="15" text-anchor="middle">Data agreement</text>
  <rect class="chip" x="894" y="700" width="116" height="28" rx="14"/>
  <text class="s" x="952" y="719" font-size="15" text-anchor="middle">Policy use</text>

  <!-- D: integrate the feedback -->
  <rect class="card" x="72" y="580" width="424" height="116" rx="8" stroke-width="2"/>
  <text class="d lab" x="96" y="608" font-size="14" letter-spacing="1.4">MAIN AGENT</text>
  <text class="d" x="96" y="636" font-size="23">Integrate the feedback</text>
  <text class="s gr" x="96" y="661" font-size="16.5">resolve findings against evidence,</text>
  <text class="s gr" x="96" y="683" font-size="16.5">then rerun the affected checks</text>

  <!-- C -> D findings (feedback) -->
  <line class="lr" x1="704" y1="638" x2="499" y2="638" marker-end="url(#s1-ah-r)"/>
  <text class="s rd" x="600" y="626" font-size="16" text-anchor="middle">findings with</text>
  <text class="s rd" x="600" y="662" font-size="16" text-anchor="middle">evidence to reproduce</text>

  <!-- D -> A and D -> B (feedback) -->
  <line class="lr" x1="160" y1="580" x2="160" y2="451" marker-end="url(#s1-ah-r)"/>
  <text class="s rd" x="174" y="521" font-size="17">revise the model</text>
  <path class="lr" d="M440 580V502H760V451" marker-end="url(#s1-ah-r)"/>
  <text class="s rd" x="600" y="490" font-size="17" text-anchor="middle">revise the implementation</text>

  <!-- Exit to deliverables -->
  <line class="ln" x1="284" y1="696" x2="284" y2="804" marker-end="url(#s1-ah)"/>
  <text class="s" x="298" y="752" font-size="17">when checks support the intended use</text>

  <!-- You get back -->
  <text class="d lab" x="56" y="790">YOU GET BACK</text>
  <rect class="card" x="72" y="806" width="448" height="144" rx="8" stroke-width="2.2"/>
  <text class="d" x="96" y="838" font-size="23">Queue model</text>
  <text class="s gr" x="96" y="864" font-size="16.5">a self-contained description of the</text>
  <text class="s gr" x="96" y="886" font-size="16.5">boundary, jobs, resources, dynamics,</text>
  <text class="s gr" x="96" y="908" font-size="16.5">stochastic mechanisms, parameters,</text>
  <text class="s gr" x="96" y="930" font-size="16.5">assumptions, and policy interface</text>

  <rect class="card" x="680" y="806" width="448" height="144" rx="8" stroke-width="2.2"/>
  <text class="d" x="704" y="838" font-size="23">Corresponding simulator</text>
  <text class="s gr" x="704" y="864" font-size="16.5">code implementing the model, with</text>
  <text class="s gr" x="704" y="886" font-size="16.5">fitted configuration and run steps,</text>
  <text class="s gr" x="704" y="908" font-size="16.5">seed control, a replaceable policy,</text>
  <text class="s gr" x="704" y="930" font-size="16.5">and trajectory or event output</text>

  <line class="ln" x1="600" y1="880" x2="523" y2="880" marker-end="url(#s1-ah)"/>
  <line class="ln" x1="600" y1="880" x2="677" y2="880" marker-end="url(#s1-ah)"/>
  <text class="s" x="600" y="866" font-size="15" text-anchor="middle">kept consistent</text>

  <text class="s" x="72" y="1000" font-size="17">plus concise validation results and the remaining issues that affect use</text>

  <!-- Optional handoff -->
  <line class="ln dash" x1="994" y1="950" x2="994" y2="976" marker-end="url(#s1-ah)"/>
  <rect class="card-dash" x="860" y="978" width="268" height="58" rx="8"/>
  <text class="d" x="880" y="1003" font-size="17">Optional handoff</text>
  <text class="s gr" x="880" y="1025" font-size="15.5">to Stage 2 on request</text>
</svg>
