<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="780" viewBox="0 0 1084 780" role="img" aria-labelledby="s1-title s1-desc">
  <title id="s1-title">Stage 1, queue modeling: a documented queue model and its matching simulator</title>
  <desc id="s1-desc">Stage 1 starts from data, such as event records, and a system description. Model construction has two steps. The first step formulates and calibrates the queue model. It defines the jobs, resources, routing, and capacity, and it states when decisions occur and what information is available at those times. It fits stochastic inputs to the data and keeps observed quantities separate from latent ones. The second step builds an executable simulator that implements the documented model, runs any feasible policy, and generates trajectories. Independent validation follows. A separate validator receives the model, the simulator, and the original data and description, and builds its own checks. The checks ask whether the model and simulator agree, whether the mechanics are right on small cases that can be checked by hand, whether the simulator agrees with the observed data, and whether behavior stays valid under other policies. Each finding comes with reproducible evidence. Findings lead to revisions of the model, the simulator, or both, and the affected checks run again. When the checks support the intended use, a reader check follows: a reader outside the work explains the model from the document alone. Unclear passages are revised. This step checks the explanation and is separate from model validation. Stage 1 delivers a documented queue model and the matching simulator, with validation evidence and the remaining issues. A handoff to Stage 2 is optional and happens only if policy work follows.</desc>
  <defs>
    <style>
      text { font-family: Helvetica, Arial, "Liberation Sans", "Nimbus Sans", sans-serif; fill: #3B4752; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .h1 { font-size: 19px; font-weight: 700; fill: #1D2731; }
      .h2 { font-size: 17px; font-weight: 700; fill: #1D2731; }
      .b { font-size: 16px; }
      .s { font-size: 15px; fill: #5A6672; }
      .blue { fill: #2B5480; }
      .amber { fill: #9A5512; }
      .slate { fill: #5A6672; }
      .card { fill: #F3F5F7; stroke: #A7B1BA; stroke-width: 1.2; }
      .sub { fill: #FFFFFF; stroke: #A7B1BA; stroke-width: 1.2; }
      .lane-c { fill: #F3F7FB; }
      .lane-v { fill: #FCF7F0; }
      .build { fill: #FFFFFF; stroke: #34618F; stroke-width: 1.8; }
      .check { fill: #FFFFFF; stroke: #B0661C; stroke-width: 1.8; }
      .quiet { fill: #FFFFFF; stroke: #8C97A1; stroke-width: 1.4; }
      .opt { fill: #FFFFFF; stroke: #5A6672; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .ar { fill: none; stroke: #1D2731; stroke-width: 2; stroke-linejoin: round; }
      .ar-loop { fill: none; stroke: #B0661C; stroke-width: 2.2; stroke-linejoin: round; }
      .ar-opt { fill: none; stroke: #5A6672; stroke-width: 2; stroke-dasharray: 7 5; }
      .dot-a { fill: #B0661C; }
    </style>
    <marker id="s1-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#1D2731"/>
    </marker>
    <marker id="s1-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#B0661C"/>
    </marker>
    <marker id="s1-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#5A6672"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1083" height="779" rx="14" fill="#FFFFFF" stroke="#D5DBE1"/>
  <text class="tag slate" x="24" y="40">STAGE 1 · QUEUE MODELING</text>

  <!-- Lane backgrounds (drawn first) -->
  <rect class="lane-c" x="200" y="64" width="860" height="210" rx="12"/>
  <rect class="lane-v" x="200" y="334" width="860" height="210" rx="12"/>

  <!-- Inputs -->
  <rect class="card" x="24" y="120" width="152" height="120" rx="10"/>
  <text class="h1" x="40" y="150">Data</text>
  <text class="b" x="40" y="176">event records</text>
  <text class="b" x="40" y="196">and a system</text>
  <text class="b" x="40" y="216">description</text>
  <line class="ar" x1="176" y1="180" x2="216" y2="180" marker-end="url(#s1-ink)"/>
  <path class="ar" d="M100 240 V450 H216" marker-end="url(#s1-ink)"/>
  <text class="s" x="112" y="300">original data</text>
  <text class="s" x="112" y="318">and description</text>

  <!-- Model construction lane -->
  <text class="tag blue" x="218" y="90">MODEL CONSTRUCTION</text>
  <rect class="build" x="218" y="104" width="330" height="152" rx="10"/>
  <text class="h1" x="236" y="134">Formulate and calibrate</text>
  <text class="b" x="236" y="162">jobs, resources, routing, capacity</text>
  <text class="b" x="236" y="184">decision times and information</text>
  <text class="b" x="236" y="206">stochastic inputs fitted to data</text>
  <text class="b" x="236" y="228">observed versus latent quantities</text>
  <line class="ar" x1="548" y1="180" x2="606" y2="180" marker-end="url(#s1-ink)"/>
  <rect class="build" x="608" y="104" width="330" height="152" rx="10"/>
  <text class="h1" x="626" y="134">Executable simulator</text>
  <text class="b" x="626" y="162">implements the documented model</text>
  <text class="b" x="626" y="184">runs any feasible policy</text>
  <text class="b" x="626" y="206">generates trajectories</text>

  <!-- Between lanes -->
  <path class="ar-loop" d="M460 374 V258" marker-end="url(#s1-amber)"/>
  <text class="s amber" x="472" y="310">revise the model</text>
  <path class="ar-loop" d="M680 374 V258" marker-end="url(#s1-amber)"/>
  <text class="s amber" x="692" y="310">revise the simulator</text>
  <line class="ar" x1="900" y1="256" x2="900" y2="372" marker-end="url(#s1-ink)"/>
  <text class="s" x="912" y="300">model and</text>
  <text class="s" x="912" y="318">simulator</text>

  <!-- Independent validation lane -->
  <text class="tag amber" x="218" y="360">INDEPENDENT VALIDATION</text>
  <rect class="check" x="218" y="374" width="824" height="152" rx="10"/>
  <text class="h1" x="236" y="404">Validation checks</text>
  <text class="s" x="236" y="428">a separate validator builds its own checks from the original evidence</text>
  <rect class="dot-a" x="236" y="453" width="8" height="8" rx="1.5"/>
  <text class="b" x="254" y="462">model and simulator agree</text>
  <rect class="dot-a" x="236" y="483" width="8" height="8" rx="1.5"/>
  <text class="b" x="254" y="492">agreement with observed data</text>
  <rect class="dot-a" x="624" y="453" width="8" height="8" rx="1.5"/>
  <text class="b" x="642" y="462">mechanics on small, checkable cases</text>
  <rect class="dot-a" x="624" y="483" width="8" height="8" rx="1.5"/>
  <text class="b" x="642" y="492">valid behavior under other policies</text>
  <text class="s amber" x="1024" y="512" text-anchor="end">each finding comes with reproducible evidence</text>

  <!-- Exit and delivery -->
  <line class="ar" x1="334" y1="526" x2="334" y2="604" marker-end="url(#s1-ink)"/>
  <text class="s" x="346" y="568">when the checks support</text>
  <text class="s" x="346" y="586">the intended use</text>

  <rect class="quiet" x="218" y="606" width="232" height="150" rx="10"/>
  <text class="h2" x="234" y="634">Reader check</text>
  <text class="s" x="234" y="658">a reader outside the work</text>
  <text class="s" x="234" y="678">explains the model from</text>
  <text class="s" x="234" y="698">the document alone</text>
  <text class="s" x="234" y="724">clarify unclear passages</text>
  <text class="s" x="234" y="742">separate from validation</text>
  <line class="ar" x1="450" y1="676" x2="484" y2="676" marker-end="url(#s1-ink)"/>

  <rect class="card" x="486" y="596" width="380" height="146" rx="10"/>
  <text class="tag slate" x="502" y="620">DELIVERED</text>
  <rect class="sub" x="500" y="632" width="168" height="70" rx="7"/>
  <text class="h2" x="514" y="660">Documented</text>
  <text class="h2" x="514" y="682">queue model</text>
  <rect class="sub" x="684" y="632" width="168" height="70" rx="7"/>
  <text class="h2" x="698" y="660">Matching</text>
  <text class="h2" x="698" y="682">simulator</text>
  <text class="s" x="502" y="728">with validation evidence and open issues</text>

  <line class="ar-opt" x1="866" y1="670" x2="918" y2="670" marker-end="url(#s1-slate)"/>
  <rect class="opt" x="920" y="630" width="140" height="84" rx="10"/>
  <text class="h2" x="936" y="658">Stage 2</text>
  <text class="s" x="936" y="680">if policy work</text>
  <text class="s" x="936" y="698">follows</text>
</svg>
