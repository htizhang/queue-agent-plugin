<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1144" viewBox="0 0 1120 1144" role="img" aria-labelledby="s2-title s2-desc">
  <title id="s2-title">Stage 2, policy design: confirm the problem, then adopt, compare, tune, or design policies</title>
  <desc id="s2-desc">Stage 2 starts from a Stage 1 handoff or from your own model or model family. For your own model, a simulator is built if needed. First, you confirm the problem in three parts. The queue family gives the shared structure and the allowed variation. The objective gives the performance measure and its direction. The constraints give the decision timing, the available information, and the feasible actions. All later work happens inside this confirmed problem, which stays fixed unless you approve a change. Check that any evaluator matches the model before using it. The work is chosen by need. Adopting an established policy, comparing applicable policies, and tuning the parameters of a fixed policy structure all end in a fair evaluation. It checks that the policy applies, gives every policy the same objective, information, and actions, tunes baselines on equal terms, and reports results for the tested instances. Designing a new or improved policy involves a coordinator and development agents. Each agent proposes, tests, and revises candidates in its own inner loop. Promising candidates go to an interpretability step, explain and simplify. It works out what each rule does, tests components by ablation and parameter sensitivity, and simplifies rules and parameters. The simplified candidate is evaluated again across the confirmed family against fair baselines, and a component is kept only if the evidence supports it. Evidence returns to the coordinator, which reviews it and steers the next research directions. The coordinator can propose a change to the problem, but only you can approve it. A final check by the coordinator reproduces the results on the tested instances and compares the final rule with the closest published methods. Each route produces an explanation of the result. Before delivery, a reader outside the work explains the policy from the report alone. Unclear passages are revised. This reader check tests the explanation and is separate from the performance tests. Stage 2 delivers a policy or recommendation with its explanation and the evidence from the tested instances.</desc>
  <defs>
    <style>
      text { font-family: Helvetica, Arial, "Liberation Sans", "Nimbus Sans", sans-serif; fill: #3B4752; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .h1 { font-size: 19px; font-weight: 700; fill: #1D2731; }
      .h2 { font-size: 17px; font-weight: 700; fill: #1D2731; }
      .h3 { font-size: 16px; font-weight: 700; fill: #1D2731; }
      .b { font-size: 16px; }
      .s { font-size: 15px; }
      .note { font-size: 15px; fill: #5A6672; }
      .lead { font-size: 15px; font-weight: 700; fill: #1D2731; }
      .blue { fill: #2B5480; }
      .amber { fill: #9A5512; }
      .slate { fill: #5A6672; }
      .white { fill: #FFFFFF; }
      .card { fill: #F3F5F7; stroke: #A7B1BA; stroke-width: 1.2; }
      .slot { fill: #F3F5F7; stroke: #A7B1BA; stroke-width: 1.2; }
      .confirm { fill: #FFFFFF; stroke: #1D2731; stroke-width: 2.2; }
      .frame { fill: none; stroke: #1D2731; stroke-width: 2.4; }
      .tab { fill: #1D2731; }
      .region { fill: #F5F8FC; stroke: #34618F; stroke-width: 1.4; }
      .build { fill: #FFFFFF; stroke: #34618F; stroke-width: 1.8; }
      .build-em { fill: #EAF1F9; stroke: #34618F; stroke-width: 2.2; }
      .build-back { fill: #FFFFFF; stroke: #9DB3CB; stroke-width: 1.3; }
      .check { fill: #FFFFFF; stroke: #B0661C; stroke-width: 1.8; }
      .quiet { fill: #FFFFFF; stroke: #8C97A1; stroke-width: 1.4; }
      .rule { stroke: #C9D0D6; stroke-width: 1.2; }
      .ar { fill: none; stroke: #1D2731; stroke-width: 2; stroke-linejoin: round; }
      .ar-loop { fill: none; stroke: #B0661C; stroke-width: 2.2; stroke-linejoin: round; }
      .ar-opt { fill: none; stroke: #5A6672; stroke-width: 2; stroke-dasharray: 7 5; }
    </style>
    <marker id="s2-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#1D2731"/>
    </marker>
    <marker id="s2-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#B0661C"/>
    </marker>
    <marker id="s2-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.6 L10 5 L0 9.4 Z" fill="#5A6672"/>
    </marker>
    <g id="s2-cycle">
      <path d="M8 0 A8 8 0 1 1 0 -8" fill="none" stroke="#B0661C" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-1 -12 L5 -8 L-1 -4 Z" fill="#B0661C"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="1119" height="1143" rx="14" fill="#FFFFFF" stroke="#D5DBE1"/>
  <text class="tag slate" x="24" y="40">STAGE 2 · POLICY DESIGN</text>

  <!-- Entry -->
  <rect class="card" x="24" y="74" width="240" height="70" rx="10"/>
  <text class="h2" x="40" y="102">Stage 1 handoff</text>
  <text class="s" x="40" y="124">model and simulator</text>
  <rect class="card" x="24" y="158" width="240" height="90" rx="10"/>
  <text class="h2" x="40" y="186">Your own model</text>
  <text class="s" x="40" y="208">or model family</text>
  <text class="note" x="40" y="228">simulator built if needed</text>
  <line class="ar" x1="264" y1="109" x2="302" y2="109" marker-end="url(#s2-ink)"/>
  <line class="ar" x1="264" y1="203" x2="302" y2="203" marker-end="url(#s2-ink)"/>

  <!-- Problem confirmation -->
  <rect class="confirm" x="304" y="74" width="556" height="174" rx="12"/>
  <text class="h1" x="324" y="106">Confirm the problem with you</text>
  <rect class="slot" x="324" y="122" width="164" height="108" rx="8"/>
  <text class="h2" x="338" y="150">Queue family</text>
  <text class="s" x="338" y="174">shared structure,</text>
  <text class="s" x="338" y="194">allowed variation</text>
  <rect class="slot" x="500" y="122" width="164" height="108" rx="8"/>
  <text class="h2" x="514" y="150">Objective</text>
  <text class="s" x="514" y="174">the measure and</text>
  <text class="s" x="514" y="194">its direction</text>
  <rect class="slot" x="676" y="122" width="164" height="108" rx="8"/>
  <text class="h2" x="690" y="150">Constraints</text>
  <text class="s" x="690" y="174">decision timing,</text>
  <text class="s" x="690" y="194">information, and</text>
  <text class="s" x="690" y="214">feasible actions</text>

  <rect class="card" x="936" y="114" width="160" height="94" rx="10" style="stroke:#1D2731; stroke-width:1.6"/>
  <text class="h1" x="950" y="146">You</text>
  <text class="s" x="950" y="170">confirm and</text>
  <text class="s" x="950" y="190">approve changes</text>
  <line class="ar" x1="936" y1="161" x2="862" y2="161" marker-end="url(#s2-ink)"/>

  <line class="ar" x1="582" y1="248" x2="582" y2="288" marker-end="url(#s2-ink)"/>
  <text class="note" x="594" y="274">confirmed</text>
  <path class="ar-opt" d="M1016 440 V212" marker-end="url(#s2-slate)"/>
  <text class="note" x="1004" y="272" text-anchor="end">may propose a change</text>

  <!-- Confirmed problem frame -->
  <rect class="frame" x="24" y="290" width="1072" height="656" rx="14"/>
  <rect class="tab" x="40" y="304" width="216" height="26" rx="6"/>
  <text class="tag white" x="54" y="322">CONFIRMED PROBLEM</text>
  <text class="lead" x="270" y="322">family, objective, and constraints stay fixed unless you approve a change</text>

  <text class="tag slate" x="48" y="362">CHOOSE THE WORK THE PROBLEM NEEDS</text>
  <text class="s" x="600" y="362">Check any evaluator against the model</text>

  <!-- Established methods -->
  <rect class="card" x="48" y="376" width="292" height="180" rx="10"/>
  <text class="h2" x="64" y="404">Adopt</text>
  <text class="s" x="64" y="424">an established policy fits</text>
  <line class="rule" x1="64" y1="438" x2="324" y2="438"/>
  <text class="h2" x="64" y="462">Compare</text>
  <text class="s" x="64" y="482">rank applicable policies</text>
  <line class="rule" x1="64" y1="496" x2="324" y2="496"/>
  <text class="h2" x="64" y="520">Tune</text>
  <text class="s" x="64" y="540">fixed structure, open parameters</text>
  <line class="ar" x1="194" y1="556" x2="194" y2="600" marker-end="url(#s2-ink)"/>
  <rect class="check" x="48" y="602" width="292" height="164" rx="10"/>
  <text class="h2" x="64" y="630">Evaluate fairly</text>
  <text class="s" x="64" y="656">check that the policy applies</text>
  <text class="s" x="64" y="678">same objective, information,</text>
  <text class="s" x="64" y="700">and actions for every policy</text>
  <text class="s" x="64" y="722">baselines tuned on equal terms</text>
  <text class="s" x="64" y="744">results for the tested instances</text>

  <!-- Design -->
  <rect class="region" x="380" y="376" width="692" height="552" rx="12"/>
  <text class="h2" x="398" y="404">Design</text>
  <text class="s" x="398" y="424">a new or improved policy</text>
  <rect class="build" x="398" y="440" width="656" height="60" rx="9"/>
  <text class="h3" x="414" y="466">Coordinator</text>
  <text class="s" x="414" y="488">reviews evidence and steers research directions</text>

  <line class="ar" x1="470" y1="500" x2="470" y2="558" marker-end="url(#s2-ink)"/>
  <text class="note" x="482" y="534">directions</text>
  <path class="ar-loop" d="M560 558 V502" marker-end="url(#s2-amber)"/>
  <text class="note amber" x="572" y="534">evidence</text>
  <path class="ar-loop" d="M990 558 V502" marker-end="url(#s2-amber)"/>
  <text class="note amber" x="978" y="534" text-anchor="end">evidence</text>

  <rect class="build-back" x="410" y="572" width="176" height="154" rx="9"/>
  <rect class="build-back" x="404" y="566" width="176" height="154" rx="9"/>
  <rect class="build" x="398" y="560" width="176" height="154" rx="9"/>
  <text class="h3" x="412" y="588">Development</text>
  <text class="h3" x="412" y="608">agents</text>
  <use href="#s2-cycle" x="552" y="594"/>
  <text class="s" x="412" y="634">propose, test, and</text>
  <text class="s" x="412" y="654">revise candidates</text>
  <text class="s amber" x="412" y="676">in inner loops</text>
  <line class="ar" x1="586" y1="637" x2="622" y2="637" marker-end="url(#s2-ink)"/>

  <rect class="build-em" x="624" y="560" width="236" height="154" rx="9"/>
  <text class="tag blue" x="642" y="586">INTERPRETABILITY</text>
  <text class="h3" x="642" y="608">Explain and simplify</text>
  <text class="s" x="642" y="632">what each rule does</text>
  <text class="s" x="642" y="654">ablation and sensitivity</text>
  <text class="s" x="642" y="676">simplify rules and</text>
  <text class="s" x="642" y="698">parameters</text>
  <line class="ar" x1="860" y1="637" x2="882" y2="637" marker-end="url(#s2-ink)"/>

  <rect class="check" x="884" y="560" width="170" height="154" rx="9"/>
  <text class="h3" x="900" y="588">Re-evaluate</text>
  <text class="s" x="900" y="614">across the</text>
  <text class="s" x="900" y="636">confirmed family,</text>
  <text class="s" x="900" y="658">with fair</text>
  <text class="s" x="900" y="680">baselines</text>

  <path class="ar-loop" d="M930 714 V758 H742 V716" marker-end="url(#s2-amber)"/>
  <text class="note amber" x="800" y="782" text-anchor="middle">keep a component only if the evidence supports it</text>
  <line class="ar" x1="1020" y1="714" x2="1020" y2="814" marker-end="url(#s2-ink)"/>

  <rect class="build" x="398" y="816" width="656" height="92" rx="9"/>
  <text class="h3" x="414" y="842">Final check by the coordinator</text>
  <text class="s" x="414" y="866">reproduce results on the tested instances</text>
  <text class="s" x="414" y="888">compare the final rule with the closest published methods</text>

  <!-- Exit and delivery -->
  <line class="ar" x1="194" y1="766" x2="194" y2="1006" marker-end="url(#s2-ink)"/>
  <line class="ar" x1="480" y1="908" x2="480" y2="1006" marker-end="url(#s2-ink)"/>
  <rect class="quiet" x="48" y="1008" width="472" height="110" rx="10"/>
  <text class="h2" x="64" y="1036">Explain the result and check clarity</text>
  <text class="s" x="64" y="1060">a reader outside the work explains the</text>
  <text class="s" x="64" y="1080">policy from the report alone</text>
  <text class="note" x="64" y="1104">revise unclear text; keep performance tests separate</text>
  <line class="ar" x1="520" y1="1063" x2="558" y2="1063" marker-end="url(#s2-ink)"/>
  <rect class="card" x="560" y="1008" width="536" height="110" rx="10"/>
  <text class="tag slate" x="576" y="1032">DELIVERED</text>
  <text class="h2" x="576" y="1058">Policy or recommendation</text>
  <text class="s" x="576" y="1082">with its explanation and the evidence</text>
  <text class="s" x="576" y="1102">from the tested instances</text>
</svg>
